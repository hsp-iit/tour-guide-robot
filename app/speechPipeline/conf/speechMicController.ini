# Remote microphone RPC endpoint
rpc_microphone_remote_port /audioRecorder_nws/rpc

# Backward-compatibility alias (if set, treated as remote endpoint)
rpc_microphone_port /audioRecorder_nws/rpc

# Optional per-catcher local RPC ports (normally keep defaults)
# rpc_microphone_sound_local_port /soundCatcher/microphone:rpc
# rpc_microphone_buffer_local_port /bufferCatcher/microphone:rpc
# rpc_microphone_transcription_local_port /transcriptionCatcher/microphone:rpc

sound_port /speechMicController/sound:i
audio_play_status_port /speechMicController/audioPlayStatus:i
transcription_port /speechMicController/transcription:i

# Minimum spacing between stop commands generated by speaker-audio callbacks
sound_stop_cooldown_ms 200

resume_delay_ms 950

# Consider playback finished when current_buffer_size <= this value
resume_when_buffer_leq 2

# Require this many consecutive idle status messages before resuming mic
min_idle_status_before_resume 2

# Fallback: if no idle status arrives after mic stop, force mic resume after this timeout (ms)
# Set to 0 to disable watchdog.
force_resume_timeout_ms 6000
