x-r1-talk-image: &r1-talk-image ghcr.io/hsp-iit/r1_talk:${UB_VERSION:-ub24.04}_gccpp_${GCCPP_VERSION:-v2.43}_cuda_${CUDA_VERSION:-12.8}_${BUILD_TYPE:-devel}

x-r1-talk-build: &r1-talk-build
  context: .
  dockerfile: Dockerfile
  args:
    base_img: ${BASE_TALK_IMG:-ubuntu:24.04}
    tour_branch: ${TOUR_BRANCH:-jazzy}
    llm_branch: ${LLM_BRANCH:-master}
    robot_code: ${ROBOT_CODE:-/usr/local/src/robot}
    user_name: yarp-user
    yarp_version: ${YARP_BRANCH:-master}
    uid: 1000
    gid: 1000
    cuda_version: ${CUDA_VERSION:-12.8}
    ai_model_path: /home/yarp-user/models

x-talk: &talk
  environment:
    - DISPLAY=${DISPLAY}
    - XAUTHORITY=/home/yarp-user/.Xauthority
    - QT_X11_NO_MITSHM=1
    - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/yarp-user/1000/bus
    - LIBGL_ALWAYS_INDIRECT=0
    - YARP_COLORED_OUTPUT=1
    - NVIDIA_DRIVER_CAPABILITIES=all
    - R1_OBR_REMOTE=${R1_OBR_REMOTE:-origin}
    - R1_OBR_BRANCH=${R1_OBR_BRANCH:-master}
    - TOUR_REMOTE=${TOUR_REMOTE:-origin}
    - TOUR_BRANCH=${TOUR_BRANCH:-jazzy}
    - ROBOT_CODE=${ROBOT_CODE:-/usr/local/src/robot}
    - AI_MODELS_PATH=/home/yarp-user/models
    - CUDA_REBUILD=${CUDA_REBUILD:-0}
    - CUDA_BUILD_JOBS=${CUDA_BUILD_JOBS:-8}
    - CUDA_ARCHITECTURES=${CUDA_ARCHITECTURES:-native}
  volumes:
    - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
    - "/etc/hosts:/etc/hosts"
    - "${HOME}/.config/yarp:/home/yarp-user/.config/yarp:rw"
    - "${HOME}/.config/credentials/google-credentials/hsp_google.json:/home/yarp-user/.config/google-credential/hsp_google.json"
    - "${HOME}/.config/credentials/azure-credentials/config.env:/home/yarp-user/.env/config.env"
    - "${PORCUPINE_CONFIG:-/usr/local/src}/:/usr/local/src/robot/.config/porcupine"
    - "${AI_MODELS_PATH:-$HOME}:/home/yarp-user/models:rw"
    - "./entrypoints/entrypoint_porcupine.sh:/home/yarp-user/config/.entrypoint_porcupine.sh"
    - "./entrypoints/entrypoint_cuda.sh:/home/yarp-user/config/.entrypoint_cuda.sh"
    - "/usr/share/ollama/.ollama/models:/usr/share/ollama/.ollama/models"
    # These named volumes survive "docker compose down --remove-orphans".
    - cuda-user-installed:/home/yarp-user/userInstalled
    - cuda-whisper-build:/usr/local/src/robot/whisper.cpp/build
    - cuda-speech-transcription-build:/usr/local/src/robot/yarp-device-speechTranscription-whisper/build
    - cuda-llama2-build:/usr/local/src/robot/yarp-device-llama2/build
  network_mode: host
  entrypoint: ["sh", "${ENTRY_POINT:-/home/yarp-user/config/.entrypoint_cuda.sh}"]
  ipc: host
  pid: host
  privileged: true
  security_opt:
    - apparmor:unconfined
  deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

services:

# Images
  r1-talk-image:
    profiles: ["build"]
    image: *r1-talk-image
    build: *r1-talk-build

  r1-talk-cuda-build:
    <<: *talk
    image: *r1-talk-image
    build: *r1-talk-build
    container_name: r1-talk-cuda-build
    entrypoint: ["sh", "/home/yarp-user/config/.entrypoint_cuda.sh"]
    command: ["true"]
    restart: "no"

# Containers
  r1-talk-container:
    <<: *talk
    image: *r1-talk-image
    container_name: r1-talk-container
    depends_on:
      r1-talk-cuda-build:
        condition: service_completed_successfully
    command: ["terminator", "-g", "/home/yarp-user/.config/terminator/config"]
  r1-talk-yarprun:
    <<: *talk
    image: *r1-talk-image
    container_name: r1-talk-yarprun
    depends_on:
      r1-talk-cuda-build:
        condition: service_completed_successfully
    command: ["bash", "-lc", "yarp conf 192.168.100.10 10000 && yarprun --server /console-llm --log"]

volumes:
  cuda-user-installed:
  cuda-whisper-build:
  cuda-speech-transcription-build:
  cuda-llama2-build: