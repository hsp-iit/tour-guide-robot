name: unified-voice-pipeline
channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # system/runtime deps better handled by conda
  - ffmpeg
  - libsndfile
  - git
  - google-cloud-cpp=2.43.0

  - pip:
      # PyTorch CUDA 12.8 wheels
      - --extra-index-url https://download.pytorch.org/whl/cu128

      # extra wheel source from original requirements
      - --find-links https://k2-fsa.github.io/icefall/piper_phonemize.html

      # ----------------------------
      # voicebox backend
      # ----------------------------
      - fastapi>=0.118.0
      - uvicorn[standard]>=0.37.0
      - pydantic>=2.5.0
      - sqlalchemy>=2.0.0
      - alembic>=1.13.0
      - torch>=2.7.0
      - torchaudio
      - transformers>=4.36.0,<=4.57.6
      - accelerate>=0.26.0
      - huggingface_hub>=0.20.0
      - qwen-tts>=0.0.5
      - linacodec @ git+https://github.com/ysharma3501/LinaCodec.git
      - Zipvoice @ git+https://github.com/ysharma3501/LuxTTS.git
      - conformer>=0.3.2
      - diffusers>=0.29.0
      - omegaconf
      - pykakasi
      - resemble-perth>=1.0.1
      - s3tokenizer
      - spacy-pkuseg
      - pyloudnorm
      - kokoro>=0.9.4
      - misaki[en]>=0.9.4
      - en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - librosa>=0.10.0
      - soundfile>=0.12.0
      - numpy>=1.24.0
      - numba>=0.60.0,<0.61.0
      - pedalboard>=0.9.0
      - httpx>=0.28.1
      - python-multipart>=0.0.6
      - Pillow>=10.0.0

      # ----------------------------
      # yarp-mcp-client
      # ----------------------------
      - mcp[cli]>=1.15.0
      - openai>=1.109.1
      - ollama>=0.6.0
      - python-dotenv>=1.1.1

      # ----------------------------
      # openwakeword core requirements
      # ----------------------------
      - onnxruntime>=1.10.0,<2
      - ai-edge-litert>=2.0.2,<3; platform_system == "Linux" or platform_system == "Darwin"
      - speexdsp-ns>=0.1.2,<1; platform_system == "Linux"
      - tqdm>=4.64.0,<5
      - scipy>=1.3,<2
      - scikit-learn>=1,<2
      - requests>=2.0,<3

      # ----------------------------
      # useful openwakeword full extras
      # ----------------------------
      - mutagen>=1.46.0,<2
      - torchinfo>=1.8.0,<2
      - torchmetrics>=0.11.4,<1
      - speechbrain>=0.5.14,<1
      - audiomentations>=0.30.0,<1
      - torch-audiomentations>=0.11.0,<1
      - acoustics>=0.2.6,<1
      - pyyaml>=6.0,<7
      - protobuf>=3.20,<4
      - pronouncing>=0.2.0,<1
      - datasets>=2.14.4,<3
      - deep-phonemizer==0.0.19

      # ----------------------------
      # Apple Silicon only
      # ----------------------------
      - mlx>=0.30.0; platform_system=="Darwin" and platform_machine=="arm64"
      - mlx-audio>=0.3.1; platform_system=="Darwin" and platform_machine=="arm64"

