name: Docker build

on:
  schedule:
  - cron: "0 2 * * 2,4"
  workflow_dispatch:


jobs:
  build-tour-docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
         config:
         - {
            work_dir: "docker_stuff/docker_talk/"
         }
    steps:
    - name: Info
      run: |
       echo "Event type: ${{github.event_name}}"
    - name: Change docker to experimental mode
      run: |
       sudo rm -rf /etc/docker/daemon.json
       echo '{"experimental": true}' | sudo tee -a /etc/docker/daemon.json
    - name: Restart docker daemon
      run: sudo systemctl restart docker
    - uses: actions/checkout@v4
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build the tour core Docker image
      working-directory: ${{matrix.config.work_dir}}
      run: |
       if [ ${{ github.event_name }} == 'schedule' ]; then
          echo "Building development tour core image"
          docker compose build r1-talk-ub24-v2-33-master
       elif [ ${{ github.event_name }} == 'workflow_dispatch' ]; then
          echo "Building stable tour core image"
          docker compose build r1-talk-ub24-v2-33-master
       else
          echo "Failure!"
          exit 1
       fi
    - name: Push tourCore2 image
      run: |
       if [ ${{ github.event_name }} == 'schedule' ]; then
          echo "Pushing tourCore2 development image"
          docker elandini84/r1_talk:ub24.04_vcpkg_gccpp_v2.33
       elif [ ${{ github.event_name }} == 'workflow_dispatch' ]; then
          echo "Pushing tourCore2 stable image"
          docker push elandini84/r1_talk:ub24.04_vcpkg_gccpp_v2.33
       else
          echo "Failure!"
          exit 1
       fi
