name: Docker build - CUDA stable

# Stable CUDA images: built from a stable YARP release branch, which is also used as image tag suffix
# (same logic as docker_stuff/docker_tourCore/env_config/stable.env + cuda.env).
on:
  schedule:
  - cron: "0 4 * * 1"
  workflow_dispatch:


jobs:
  build-tour-docker:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
             ros2_distro: "jazzy",
             base_image: "nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04",
             base_image_label: "cuda.12.8.1-cudnn",
             work_dir: "docker_stuff/docker_tourCore/",
             yarp_branch: "yarp-4.0",
             mesh_branch: "devel"
          }
    permissions:
      contents: read
      packages: write

    steps:
      - name: Info
        run: |
         echo "Event type: ${{github.event_name}}"

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tourCore2 image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.config.work_dir }}
          file: ${{ matrix.config.work_dir }}/Dockerfile
          build-args: |
            base_img=${{matrix.config.base_image}}
            ros_distro=${{matrix.config.ros2_distro}}
            yarp_branch=${{matrix.config.yarp_branch}}
            mesh_branch=${{matrix.config.mesh_branch}}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/r1images:tourCore2_${{matrix.config.base_image_label}}_${{matrix.config.ros2_distro}}_${{matrix.config.yarp_branch}}

  build-tour-docker-sim:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
             ros2_distro: "jazzy",
             base_image: "nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04",
             base_image_label: "cuda.12.8.1-cudnn",
             work_dir: "docker_stuff/docker_sim/",
             yarp_branch: "yarp-4.0",
             mesh_branch: "devel"
          }
    permissions:
      contents: read
      packages: write

    steps:
      - name: Info
        run: |
         echo "Event type: ${{github.event_name}}"

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tourSim2 image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.config.work_dir }}
          file: ${{ matrix.config.work_dir }}/Dockerfile
          build-args: |
            base_img=${{matrix.config.base_image}}
            ros_distro=${{matrix.config.ros2_distro}}
            yarp_branch=${{matrix.config.yarp_branch}}
            mesh_branch=${{matrix.config.mesh_branch}}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/r1images:tourSim2_${{matrix.config.base_image_label}}_${{matrix.config.ros2_distro}}_${{matrix.config.yarp_branch}}
