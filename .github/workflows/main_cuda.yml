name: Docker build - CUDA

on:
  schedule:
  - cron: "0 3 * * 1,3,5"
  workflow_dispatch:


jobs:
  build-tour-docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # - {
          #     ros2_distro: "jazzy",
          #     base_image: "ubuntu:24.04",
          #     base_image_label: "ubuntu24.04",
          #     work_dir: "docker_stuff/docker_tourCore/"
          #   }
          - {
             ros2_distro: "jazzy",
             base_image: "nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04",
             base_image_label: "cuda.12.8.1-cudnn",
             work_dir: "docker_stuff/docker_tourCore/"
          }
          # - {
          #    ros2_distro: "jazzy",
          #    base_image: "ste93/convince:ubuntu_24.04_qt_6.8.3",
          #    base_image_label: "ubuntu_24.04_qt_6.8.3",
          #    work_dir: "docker_stuff/docker_tourCore/"
          # }

    steps:
      - name: Info
        run: |
         echo "Event type: ${{github.event_name}}"

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push tourCore2 image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.config.work_dir }}
          file: ${{ matrix.config.work_dir }}/Dockerfile
          build-args: |
            base_img=${{matrix.config.base_image}}
            ros_distro=${{matrix.config.ros2_distro}}
          push: true
          tags: |
            elandini84/r1images:tourCore2_${{matrix.config.base_image_label}}_${{matrix.config.ros2_distro}}_${{ github.event_name == 'schedule' && 'devel' || 'stable' }}

  build-tour-docker-sim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          # - {
          #     ros2_distro: "jazzy",
          #     base_image: "ubuntu:24.04",
          #     base_image_label: "ubuntu24.04",
          #     work_dir: "docker_stuff/docker_sim/"
          #   }
          - {
             ros2_distro: "jazzy",
             base_image: "nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04",
             base_image_label: "cuda.12.8.1-cudnn",
             work_dir: "docker_stuff/docker_sim/"
          }
          # - {
          #    ros2_distro: "jazzy",
          #    base_image: "ste93/convince:ubuntu_24.04_qt_6.8.3",
          #    base_image_label: "ubuntu_24.04_qt_6.8.3",
          #    work_dir: "docker_stuff/docker_sim/"
          # }

    steps:
      - name: Info
        run: |
         echo "Event type: ${{github.event_name}}"

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push tourSim2 image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.config.work_dir }}
          file: ${{ matrix.config.work_dir }}/Dockerfile
          build-args: |
            base_img=${{matrix.config.base_image}}
            ros_distro=${{matrix.config.ros2_distro}}
          push: true
          tags: |
            elandini84/r1images:tourSim2_${{matrix.config.base_image_label}}_${{matrix.config.ros2_distro}}_${{ github.event_name == 'schedule' && 'devel' || 'stable' }}
