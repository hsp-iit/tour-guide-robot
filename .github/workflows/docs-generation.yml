name: Run Python Script

on:
  push:
    branches:
      - feat/docs     # workflow runs only when code is pushed to "feat/docs" branch
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/docs  # ensure we are on the correct branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: |
          cd app/convince
          python script.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/convince/README.md
          git commit -m "Update README from script.py" || echo "No changes to commit"
          git push origin HEAD:feat/docs

